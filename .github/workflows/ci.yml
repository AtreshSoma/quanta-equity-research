# QUANTA CI
#
# Three jobs, deliberately separated by cost:
#
#   python      ~1m, runs on every push. Dependency ranges from pyproject.toml,
#               so it also acts as an early warning when an upstream release
#               breaks us. Covers the engine and the Flask web app.
#   javascript  ~30s. The web app's node:test + jsdom unit suite.
#   golden      ~3m, replays recorded fixtures. Pinned to the exact environment
#               the fixtures were recorded in, because they contain pickled
#               DataFrames and pickle is not a stable cross-version format.
#   audit       ~1m, pip-audit and npm audit; advisory, never blocks a push.
#   browser     ~3m, Playwright in Chromium (desktop and phone) on the specs that
#               need no market data: the live chart's tools and My list (with
#               mocked bars), WCAG 2.1 AA on the tear sheet and Evidence page,
#               the top bar at every width, and the Guide. The full
#               suite also reads live Yahoo data, so it stays a local run
#               (`npm run test:e2e`).
#
# No unit job touches the network: the unit suites are mocked and the golden
# suite replays fixtures with all HTTP blocked.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: no job here writes to the repository, so a compromised step
# or dependency cannot push, tag or open releases with it.
permissions:
  contents: read

jobs:
  python:
    name: python suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The webapp extra is required because the web-app tests import the
          # Flask app.
          pip install -e ".[dev,webapp]"

      - name: Lint (errors only)
        run: ruff check .

      - name: Test
        # The golden suite is excluded here and run in its own pinned job.
        run: pytest -m "not golden" -q

  javascript:
    name: web app unit suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  golden:
    name: golden master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned recording environment
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/golden/requirements-lock.txt
          pip install flask

      - name: Replay fixtures
        # A failure here means engine output changed. That is not automatically
        # a bug -- see the workflow in tests/test_golden_master.py -- but it
        # must be acknowledged by re-freezing the snapshot in the same commit.
        run: pytest -m golden -q

  audit:
    name: dependency audit
    # pyproject.toml pins floors only, so a newly disclosed vulnerability in
    # yfinance, Flask, pandas or a transitive package would otherwise go
    # unnoticed. Advisory for now (continue-on-error): it reports, it does not
    # block a push, because an upstream advisory is not a defect in this repo.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[webapp]" pip-audit

      - name: Audit installed packages
        run: pip-audit --progress-spinner off

      - name: Audit the npm test toolchain
        working-directory: webapp
        run: |
          npm ci
          npm audit --audit-level=high

  browser:
    name: browser suite (no market data)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "..[webapp]"
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        env:
          QUANTA_E2E_PYTHON: python
        run: >
          npx playwright test tests/e2e/charts_mylist.spec.ts tests/e2e/a11y_research_evidence.spec.ts tests/e2e/topbar.spec.ts tests/e2e/guide.spec.ts
          --project=desktop-dark --project=mobile

      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp/playwright-report
          retention-days: 7
